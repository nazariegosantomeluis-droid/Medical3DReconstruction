[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medical3d"
version = "1.0.0"
description = "Organ-specific classical segmentation and 3D mesh reconstruction from CT/MRI (lungs, heart, liver, kidneys)."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
